services:
  backend:
    build: ./backend
    working_dir: /project/backend
    volumes:
      - ./backend:/project/backend
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 10
  frontend:
    build: ./frontend/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
