services:
  backend:
    restart: unless-stopped
    build: ./backend
    working_dir: /project/backend
    volumes:
      - ./backend:/project/backend
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 10
  frontend:
    restart: unless-stopped
    build: ./frontend/app
    environment:
      MECHGUARD_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
  wifi:
    restart: unless-stopped
    build: ./backend
    command: ["python", "-m", "uvicorn", "app.wifi_receiver:app", "--host", "0.0.0.0", "--port", "8010"]
    volumes:
      - ./backend:/project/backend
    environment:
      ESP32_KEY: "${ESP32_KEY:-}"
      ESP32_DEVICE_ID: "${ESP32_DEVICE_ID:-ESP32-1}"
    ports:
      - "${ESP32_BIND_IP:-127.0.0.1}:8010:8010"
    depends_on:
      backend:
        condition: service_healthy
